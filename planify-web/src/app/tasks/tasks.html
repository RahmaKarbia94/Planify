<div class="dashboard-container">
  <div class="header-actions">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <button class="glass-btn" (click)="goBack()">← Back</button>
      <h2>Project Tasks</h2>
    </div>
    <button class="glass-btn primary" (click)="openModal()">Add Task</button>
  </div>

  <div *ngIf="tasks.length === 0" class="glass-card" style="text-align: center; margin-top: 2rem;">
    <p class="text-muted">No tasks found for this project.</p>
  </div>

  <div class="projects-grid">
    <div class="glass-card" *ngFor="let task of tasks" style="position: relative;">
      <button class="glass-btn" style="position: absolute; top: 10px; right: 10px; padding: 4px 10px; border-color: #ef4444; color: #ef4444; z-index: 10;" (click)="deleteTask(task._id)">X</button>
      <h3 style="margin-top: 0; padding-right: 2rem;">{{ task.title }}</h3>
      <p class="text-muted">{{ task.description }}</p>
      
      <div style="margin-top: 1rem;">
        <select class="form-input" [value]="task.status" (change)="updateStatus(task, $event)" style="padding: 8px;">
          <option value="To Do">To Do</option>
          <option value="In Progress">In Progress</option>
          <option value="Done">Done</option>
        </select>
      </div>
    </div>
  </div>
</div>

<!-- Modal Overlay -->
<div class="modal-overlay" *ngIf="isModalOpen">
  <div class="glass-card modal-content">
    <h3 style="margin-top: 0;">New Task</h3>
    <div style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem;">
      <input type="text" [(ngModel)]="taskForm.title" placeholder="Task Title" class="form-input">
      <input type="text" [(ngModel)]="taskForm.description" placeholder="Description" class="form-input">
      <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1rem;">
        <button class="glass-btn" (click)="closeModal()">Cancel</button>
        <button class="glass-btn primary" (click)="createTask()">Create</button>
      </div>
    </div>
  </div>
</div>
