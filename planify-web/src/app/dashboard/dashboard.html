<div class="dashboard-container">
  <div class="header-actions">
    <h2>My Projects</h2>
    <div style="display: flex; gap: 1rem;">
      <button class="glass-btn primary" (click)="openModal()">Create Project</button>
      <button class="glass-btn" (click)="logout()">Logout</button>
    </div>
  </div>

  <div *ngIf="projects.length === 0" class="glass-card" style="text-align: center; margin-top: 2rem;">
    <p class="text-muted">No projects found. Create one to get started.</p>
  </div>

  <div class="projects-grid">
    <div class="glass-card" *ngFor="let project of projects" (click)="viewProject(project._id)" style="cursor: pointer; position: relative;">
      <button class="glass-btn" style="position: absolute; top: 10px; right: 10px; padding: 4px 10px; border-color: #ef4444; color: #ef4444; z-index: 10;" (click)="deleteProject(project._id, $event)">X</button>
      <h3 style="margin-top: 0;">{{ project.name }}</h3>
      <p class="text-muted">{{ project.description }}</p>
    </div>
  </div>
</div>

<!-- Modal Overlay -->
<div class="modal-overlay" *ngIf="isModalOpen">
  <div class="glass-card modal-content">
    <h3 style="margin-top: 0;">New Project</h3>
    <div style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem;">
      <input type="text" [(ngModel)]="newProject.name" placeholder="Project Name" class="form-input">
      <input type="text" [(ngModel)]="newProject.description" placeholder="Description" class="form-input">
      <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1rem;">
        <button class="glass-btn" (click)="closeModal()">Cancel</button>
        <button class="glass-btn primary" (click)="createProject()">Create</button>
      </div>
    </div>
  </div>
</div>
