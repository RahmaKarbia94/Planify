<div class="dashboard-header">
  <h2>My Projects</h2>
  <button class="glass-btn primary" (click)="openModal()">Create Project</button>
</div>

<div class="projects-grid" style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px;">
  <!-- Render each project -->
  <div class="glass-card effect-3d" *ngFor="let project of projects" 
       style="min-width: 250px; cursor: pointer;" 
       (click)="viewProject(project._id)">
    <h3>{{ project.name }}</h3>
    <p>{{ project.description }}</p>
  </div>

  <!-- Empty state -->
  <div class="glass-card effect-3d" *ngIf="projects.length === 0" style="width: 100%; text-align: center;">
    <p>No projects found. Create one to get started.</p>
  </div>
</div>

<div class="modal-overlay" *ngIf="showModal">
  <div class="glass-card effect-3d modal-content">
    <h3>New Project</h3>
    <form (ngSubmit)="createProject()">
      <div class="input-group">
        <input type="text" name="name" [(ngModel)]="newProject.name" placeholder="Project Name" required>
      </div>
      <div class="input-group">
        <input type="text" name="description" [(ngModel)]="newProject.description" placeholder="Description">
      </div>
      <div class="modal-actions">
        <button type="button" class="glass-btn" (click)="closeModal()">Cancel</button>
        <button type="submit" class="glass-btn primary">Create</button>
      </div>
      <div class="glass-card effect-3d" *ngFor="let project of projects" style="min-width: 250px; cursor: pointer; position: relative;" (click)="viewProject(project._id)">
    <button class="glass-btn" style="position: absolute; top: 10px; right: 10px; padding: 5px 10px; color: #f87171; z-index: 10;" (click)="deleteProject(project._id, $event)">X</button>
    <h3>{{ project.name }}</h3>
    <p>{{ project.description }}</p>
  </div>
  <div class="dashboard-header" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
  <h2>My Projects</h2>
  <div>
    <button class="glass-btn primary" (click)="openModal()" style="margin-right: 10px;">Create Project</button>
    <button class="glass-btn" (click)="logout()">Logout</button>
  </div>
</div>
    </form>
  </div>
</div>
