<div class="auth-wrapper">
  <div class="glass-card effect-3d">
    <div class="tabs">
      <button class="tab-btn active">Login</button>
      <button class="tab-btn">Sign Up</button>
    </div>
    
    <h2>Welcome Back</h2>
    
    <form class="auth-form" (ngSubmit)="login()">
      <div class="input-group">
        <span class="icon">✉</span>
        <input type="email" name="email" [(ngModel)]="email" placeholder="Email" required>
      </div>
      
      <div class="input-group">
        <span class="icon">🔒</span>
        <input type="password" name="password" [(ngModel)]="password" placeholder="Password" required>
      </div>
      
      <button type="submit" class="glass-btn primary">Login</button>
    </form>
  </div>
</div>
